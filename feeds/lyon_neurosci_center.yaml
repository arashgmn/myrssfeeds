# Name of the site (used in the feed)
site_name: "Lyon Neuroscience Research Centre"
# URL to fetch
url: "http://www.crnl.fr/en/offres-emploi?language=en"
# CSS selector that identifies each entry/article block
item_selector: "views-element-container form-group"

# Within each item, CSS selectors for the fields
fields:
  title: "div.views-field views-field-title"
  subtitle: "s"
  description: "div.views-field views-field-field-teaser"
  link: "a"          # href attribute of this element will be used
  picture: ""         # will read the `src` attribute

# Optional: prefix to prepend if links are relative
link_prefix: "http://www.crnl.fr/"

