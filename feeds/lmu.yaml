site_name: "LMU academic staff"
url: "https://www.lmu.de/en/about-lmu/working-at-lmu/job-portal/academic-staff/"
description: "LMU academic staff vacancies (en)"
language: "en"

# The listing is injected by the b-ite jobs widget, so render it in a browser.
render_js: true

item_selector: "table.bite-jobs-list tr.bite-jobs-list--row"

fields:
  title: "td.bite-jobs-list--title"
  subtitle: "td.bite-jobs-list--fakultaet"
  description: "td.bite-jobs-list--verguetung"
  # The widget exposes no per-job URL; entries fall back to the listing page.
  link: ""
  picture: ""

link_prefix: "https://www.lmu.de"

# Keyword filter: AND/OR/NOT + parentheses; empty = keep every entry.
filter: "(NOT (hiwi OR hi-wi)) AND (postdoc OR post-doc OR postdoctorate OR postdoctoral)"
